AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Lifecycle Policies for Automatic Data Management'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  BucketName:
    Type: String
    Description: Name of the S3 bucket for video storage
    Default: opus-clip-videos

Resources:
  VideoStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketName}-${Environment}'
      VersioningConfiguration:
        Status: Enabled  # Enable versioning for data protection
      LifecycleConfiguration:
        Rules:
          # Rule 1: Delete processed clips after 3 days
          - Id: DeleteClipsAfter3Days
            Status: Enabled
            Prefix: users/
            ExpirationInDays: 3
            NoncurrentVersionExpirationInDays: 1
            TagFilters:
              - Key: Type
                Value: ProcessedClip

          # Rule 2: Move original videos to Glacier Instant Retrieval after 7 days
          - Id: ArchiveOriginalVideosAfter7Days
            Status: Enabled
            Prefix: users/
            Transitions:
              - TransitionInDays: 7
                StorageClass: GLACIER_IR  # Glacier Instant Retrieval
            TagFilters:
              - Key: Type
                Value: OriginalVideo

          # Rule 3: Move transcripts to Infrequent Access after 7 days
          - Id: MoveTranscriptsToIA
            Status: Enabled
            Prefix: users/
            Transitions:
              - TransitionInDays: 7
                StorageClass: STANDARD_IA
            TagFilters:
              - Key: Type
                Value: Transcript

          # Rule 4: Delete everything after 30 days
          - Id: DeleteAllAfter30Days
            Status: Enabled
            Prefix: users/
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 30

          # Rule 5: Clean up incomplete multipart uploads
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

          # Rule 6: Delete temporary processing files immediately
          - Id: DeleteTempFiles
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 1

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - 'https://*.example.com'  # Replace with your domain
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 3600

      NotificationConfiguration:
        LambdaConfigurations:
          # Trigger Lambda when video uploaded
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: users/
                  - Name: suffix
                    Value: .mp4
            Function: !GetAtt VideoUploadNotificationFunction.Arn

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: VideoStorage

  # Lambda function for S3 event notifications
  VideoUploadNotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-video-upload-notification'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt VideoUploadNotificationRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3

          def lambda_handler(event, context):
              """Notify when video is uploaded to S3."""
              for record in event['Records']:
                  bucket = record['s3']['bucket']['name']
                  key = record['s3']['object']['key']
                  size = record['s3']['object']['size']

                  print(f"Video uploaded: {bucket}/{key} ({size} bytes)")

                  # TODO: Send notification or trigger processing

              return {'statusCode': 200}
      Tags:
        - Key: Environment
          Value: !Ref Environment

  VideoUploadNotificationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${VideoStorageBucket.Arn}/*'
                  - !GetAtt VideoStorageBucket.Arn

  # Permission for S3 to invoke Lambda
  VideoUploadNotificationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VideoUploadNotificationFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt VideoStorageBucket.Arn

  # CloudWatch metric filter for storage costs
  StorageCostMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '[time, request_id, event_type = "ObjectCreated:*", ...]'
      LogGroupName: !Sub '/aws/s3/${VideoStorageBucket}'
      MetricTransformations:
        - MetricName: StorageObjectsCreated
          MetricNamespace: VideoProcessing/Storage
          MetricValue: '1'
          DefaultValue: 0

Outputs:
  BucketName:
    Description: Name of S3 bucket
    Value: !Ref VideoStorageBucket
    Export:
      Name: !Sub '${Environment}-VideoStorageBucketName'

  BucketArn:
    Description: ARN of S3 bucket
    Value: !GetAtt VideoStorageBucket.Arn
    Export:
      Name: !Sub '${Environment}-VideoStorageBucketArn'

  BucketDomainName:
    Description: Domain name of S3 bucket
    Value: !GetAtt VideoStorageBucket.DomainName
    Export:
      Name: !Sub '${Environment}-VideoStorageBucketDomain'
